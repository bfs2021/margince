<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Margince backgrounds</title>
<!--
  Source of the background images the .pptx and .docx helpers place under
  their text. The gradients mirror templates/deck.html and
  templates/document.html; change all three together, then run
  scripts/render_backgrounds.sh. The URL hash picks the one piece to draw.
-->
<style>
  :root {
    --mesh:
      radial-gradient(55% 80% at 100% 0%, rgba(91, 97, 214, .16), transparent 60%),
      radial-gradient(70% 90% at 85% 10%, rgba(43, 182, 115, .30), transparent 60%),
      radial-gradient(80% 120% at 0% 100%, rgba(11, 122, 83, .70), transparent 70%),
      linear-gradient(135deg, #08603f 0%, #06402a 100%);
    --bandFill:
      radial-gradient(60% 220% at 92% 0%, rgba(255, 255, 255, .10), transparent 60%),
      radial-gradient(40% 200% at 100% 100%, rgba(91, 97, 214, .16), transparent 70%),
      linear-gradient(100deg, #0a6f4b 0%, #0b7a53 55%, #108a5e 100%);
  }
  html, body { margin: 0; background: transparent; }
  .piece { display: none; position: relative; overflow: hidden; }
  #hero { width: 1280px; height: 720px; background: var(--mesh); }
  #paper {
    width: 1280px; height: 720px;
    background:
      radial-gradient(900px 620px at -8% -20%, rgba(24, 190, 120, .10), transparent 70%),
      radial-gradient(900px 620px at 108% -20%, rgba(91, 97, 214, .10), transparent 70%),
      #f1f5f2;
  }
  #band { width: 1240px; height: 64px; border-radius: 18px; background: var(--bandFill); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .18); }
  #panel { width: 400px; height: 680px; border-radius: 24px; background: var(--mesh); }
  #docband { width: 733px; height: 249px; border-radius: 19px; background: var(--mesh); }
</style>
</head>
<body>
<div class="piece" id="hero"></div>
<div class="piece" id="paper"></div>
<div class="piece" id="band"></div>
<div class="piece" id="panel"></div>
<div class="piece" id="docband"></div>
<script>
  document.getElementById(location.hash.slice(1)).style.display = "block";
</script>
</body>
</html>
